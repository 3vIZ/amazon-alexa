<body class="h-full flex flex-col justify-between select-none">

    <div class="w-full p-3 z-10 flex items-center justify-between bg-gray-950/80 border-b border-gray-800/50 backdrop-blur-md px-4 sm:px-8">
        <!-- Model Switcher Buttons -->
        <div class="flex items-center space-x-2 bg-gray-900/90 p-1 rounded-2xl border border-gray-800 shadow-lg">
            <button onclick="switchModel('regular')" id="btnRegular" class="px-4 py-1.5 rounded-xl text-xs font-semibold text-gray-400 hover:text-white transition-all">
                Alexa Regular (Light Bar)
            </button>
            <button onclick="switchModel('plus')" id="btnPlus" class="px-4 py-1.5 rounded-xl text-xs font-bold bg-indigo-600 text-white transition-all shadow-md alexa-plus-glow">
                Alexa+ (Wave AI)
            </button>
        </div>

        <!-- Download HTML Button -->
        <button onclick="downloadHTML()" title="Download source code" class="flex items-center space-x-2 bg-gray-900/90 hover:bg-gray-800 text-gray-300 hover:text-white px-3 py-1.5 rounded-xl text-xs font-medium border border-gray-800 transition-all shadow-md active:scale-95 cursor-pointer">
            <i class="fa-solid fa-download text-indigo-400"></i>
            <span class="hidden sm:inline">Download HTML</span>
        </button>
    </div>

    <main class="relative flex-1 flex flex-col items-center justify-between w-full max-w-3xl mx-auto px-4 py-4 overflow-hidden">
        
        <div id="chatContainer" class="w-full flex-1 overflow-y-auto space-y-4 pr-2 mb-4 flex flex-col">
            <!-- Initial Greeting -->
            <div class="flex items-start space-x-3">
                <div class="w-8 h-8 rounded-full bg-indigo-500/10 border border-indigo-500/30 flex items-center justify-center text-indigo-400 flex-shrink-0 alexa-plus-glow" id="greetingAvatar">
                    <i class="fa-solid fa-wand-magic-sparkles text-xs" id="greetingAvatarIcon"></i>
                </div>
                <div class="bg-gray-900/80 border border-gray-800/80 rounded-2xl px-4 py-3 max-w-[85%] text-sm text-gray-200 shadow-md" id="greetingText">
                    Hello! I'm Amazon Alexa+ with immersive wavy visualizer and advanced real AI. Ask me anything!
                </div>
            </div>
        </div>

        <div class="w-full bg-gray-900/90 border border-gray-800 rounded-2xl p-2 shadow-2xl flex items-center space-x-2 z-20 backdrop-blur-md">
            <input type="text" id="userInput" placeholder="Ask Alexa+..." class="flex-1 bg-transparent border-none outline-none text-base px-3 text-gray-100 placeholder-gray-500">
            
            <button onclick="handleSend()" id="sendBtn" class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-semibold px-4 py-2.5 rounded-xl text-xs flex items-center space-x-1.5 hover:opacity-90 transition-all shadow-md shadow-indigo-500/20 cursor-pointer">
                <span>Send</span>
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
    </main>

    <footer class="w-full h-32 relative z-10 flex items-center justify-center bg-gray-950 border-t border-gray-800/60 backdrop-blur-md">
        <canvas id="visualizerCanvas" class="absolute inset-0 w-full h-full cursor-pointer" width="440" height="127"></canvas>
    </footer>

    <script>
        const canvas = document.getElementById('visualizerCanvas');
        const ctx = canvas.getContext('2d');
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const greetingText = document.getElementById('greetingText');
        const greetingAvatar = document.getElementById('greetingAvatar');
        const greetingAvatarIcon = document.getElementById('greetingAvatarIcon');
        const sendBtn = document.getElementById('sendBtn');

        // Function to trigger HTML download of the current document
        function downloadHTML() {
            const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
            const blob = new Blob([htmlContent], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'amazon_alexa.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        let width, height;
        let time = 0;
        let currentMode = 'idle'; // idle, thinking, speaking
        let currentModel = 'plus'; // regular or plus
        let energy = 0.6;
        let targetEnergy = 0.6;

        // Conversation history for Alexa+ context memory
        const alexaPlusHistory = [];

        // Floating ambient particles for Alexa+ wave mode
        const particles = [];
        const particleCount = 25;

        function switchModel(model) {
            currentModel = model;
            const btnReg = document.getElementById('btnRegular');
            const btnPlus = document.getElementById('btnPlus');

            if (model === 'regular') {
                btnReg.className = "px-4 py-1.5 rounded-xl text-xs font-bold bg-cyan-600 text-white transition-all shadow-md alexa-classic-glow";
                btnPlus.className = "px-4 py-1.5 rounded-xl text-xs font-semibold text-gray-400 hover:text-white transition-all";
                
                greetingText.textContent = "Hello! I'm Amazon Alexa (Regular). Ask me simple commands like 'hi', 'what time is it', or 'weather'!";
                greetingAvatar.className = "w-8 h-8 rounded-full bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center text-cyan-400 flex-shrink-0";
                greetingAvatarIcon.className = "fa-solid fa-robot text-xs";
                
                userInput.placeholder = "Ask Alexa (e.g. 'hi', 'time', 'weather')...";
                sendBtn.className = "bg-gradient-to-r from-cyan-600 to-blue-600 text-white font-semibold px-4 py-2.5 rounded-xl text-xs flex items-center space-x-1.5 hover:opacity-90 transition-all shadow-md shadow-cyan-500/20 cursor-pointer";

                appendMessage("Switched to Alexa Regular mode.", false);
            } else {
                btnPlus.className = "px-4 py-1.5 rounded-xl text-xs font-bold bg-indigo-600 text-white transition-all shadow-md alexa-plus-glow";
                btnReg.className = "px-4 py-1.5 rounded-xl text-xs font-semibold text-gray-400 hover:text-white transition-all";
                
                greetingText.textContent = "Hello! I'm Amazon Alexa+ with full memory of our conversation and advanced real AI. Ask me anything!";
                greetingAvatar.className = "w-8 h-8 rounded-full bg-indigo-500/10 border border-indigo-500/30 flex items-center justify-center text-indigo-400 flex-shrink-0 alexa-plus-glow";
                greetingAvatarIcon.className = "fa-solid fa-wand-magic-sparkles text-xs";

                userInput.placeholder = "Ask Alexa+ (remembers recent context)...";
                sendBtn.className = "bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-semibold px-4 py-2.5 rounded-xl text-xs flex items-center space-x-1.5 hover:opacity-90 transition-all shadow-md shadow-indigo-500/20 cursor-pointer";

                appendMessage("Switched to Alexa+ with chat history memory.", false);
            }
        }

        function resize() {
            width = canvas.width = canvas.parentElement.clientWidth;
            height = canvas.height = canvas.parentElement.clientHeight;
            initParticles();
        }

        window.addEventListener('resize', resize);
        resize();

        function initParticles() {
            particles.length = 0;
            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 1.5 + 0.5,
                    vx: (Math.random() - 0.5) * 0.3,
                    vy: (Math.random() - 0.5) * 0.3,
                    alpha: Math.random() * 0.3 + 0.1
                });
            }
        }

        function setStatus(mode) {
            currentMode = mode;
            if (currentModel === 'plus') {
                if (mode === 'thinking') targetEnergy = 1.1;
                else if (mode === 'speaking') targetEnergy = 1.3;
                else targetEnergy = 0.5;
            }
        }

        async function handleSend() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, true);
            userInput.value = '';

            setStatus('thinking');

            if (currentModel === 'regular') {
                setTimeout(() => {
                    const responseText = getClassicDumbAlexaResponse(text);
                    appendMessage(responseText, false);
                    setStatus('speaking');

                    const speechDuration = Math.min(Math.max(responseText.length * 40, 1500), 4500);
                    setTimeout(() => {
                        setStatus('idle');
                    }, speechDuration);
                }, 1000);
            } else {
                try {
                    // Save user prompt into memory history
                    alexaPlusHistory.push({ role: "user", parts: [{ text }] });

                    const responseText = await fetchRealAIResponse();
                    
                    // Save bot response into memory history
                    alexaPlusHistory.push({ role: "model", parts: [{ text: responseText }] });

                    appendMessage(responseText, false);
                    setStatus('speaking');

                    const speechDuration = Math.min(Math.max(responseText.length * 30, 1500), 5000);
                    setTimeout(() => {
                        setStatus('idle');
                    }, speechDuration);
                } catch (err) {
                    appendMessage("Alexa+ connection error. Please try again.", false);
                    setStatus('idle');
                }
            }
        }

        async function fetchRealAIResponse() {
            const systemPrompt = "You are Amazon Alexa+, an advanced, helpful, and intelligent AI assistant. You remember earlier context in this ongoing conversation.";
            const apiKey = "";
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            // Send full conversation history so Alexa+ retains memory of previous messages
            const payload = {
                contents: alexaPlusHistory,
                systemInstruction: { parts: [{ text: systemPrompt }] }
            };

            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const result = await response.json();
            const candidate = result.candidates?.[0];
            if (candidate && candidate.content?.parts?.[0]?.text) {
                return candidate.content.parts[0].text;
            } else {
                throw new Error("Invalid API response");
            }
        }

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSend();
        });

        function formatMarkdown(text) {
            let safe = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            return safe.replace(/\*\*(.*?)\*\*/g, '<strong class="font-bold text-white">$1</strong>');
        }

        function appendMessage(text, isUser) {
            const div = document.createElement('div');
            div.className = `flex items-start space-x-3 ${isUser ? 'flex-row-reverse space-x-reverse' : ''}`;
            
            const formattedContent = formatMarkdown(text);
            const userBg = currentModel === 'regular' ? 'bg-cyan-600/20 border-cyan-500/30 text-cyan-100' : 'bg-indigo-600/20 border-indigo-500/30 text-indigo-100';
            const botIcon = currentModel === 'regular' ? 'fa-robot text-cyan-400' : 'fa-wand-magic-sparkles text-indigo-400';
            const botBg = currentModel === 'regular' ? 'bg-cyan-500/10 border-cyan-500/30' : 'bg-indigo-500/10 border-indigo-500/30';

            div.innerHTML = `
                <div class="w-8 h-8 rounded-full ${isUser ? userBg : botBg} border flex items-center justify-center flex-shrink-0">
                    <i class="fa-solid ${isUser ? 'fa-user' : botIcon} text-xs"></i>
                </div>
                <div class="${isUser ? userBg : 'bg-gray-900/80 border border-gray-800/80 text-gray-200'} rounded-2xl px-4 py-3 max-w-[85%] text-sm shadow-md">
                    ${formattedContent}
                </div>
            `;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function getClassicDumbAlexaResponse(query) {
            const q = query.toLowerCase().trim();

            // Simple Greetings
            if (q === 'hi' || q === 'hello' || q === 'hey' || q.startsWith('hi ') || q.startsWith('hello ')) {
                return "Hello! How can I help you today?";
            } 
            if (q.includes('how are you')) {
                return "I'm doing great, thank you for asking!";
            }
            if (q.includes('what is your name') || q.includes('who are you')) {
                return "I'm **Alexa**.";
            }

            // Simple Routine Commands
            if (q.includes('weather') || q.includes('rain') || q.includes('temperature')) {
                return "Currently in Waldorf, it is **72 degrees and mostly cloudy**.";
            } 
            if (q.includes('time') || q.includes('clock')) {
                const now = new Date();
                return `The time is **${now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}**.`;
            }
            if (q.includes('date') || q.includes('day')) {
                const now = new Date();
                return `Today is **${now.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' })}**.`;
            }
            if (q.includes('joke')) {
                return "Why don't skeletons fight each other? **They don't have the guts.**";
            }
            if (q.includes('timer') || q.includes('alarm')) {
                return "Timer set for 5 minutes.";
            }
            if (q.includes('stop') || q.includes('cancel') || q.includes('quiet')) {
                return "Stopping.";
            }

            // Fallback for complex/unhandled queries
            return "I'm sorry, I can't help with that.";
        }

        function drawWave(yOffset, frequency, amplitude, color, lineWidth, phaseShift) {
            ctx.beginPath();
            ctx.lineWidth = lineWidth;
            ctx.strokeStyle = color;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            const sliceWidth = width / 250;
            let x = 0;

            for (let i = 0; i <= 250; i++) {
                const sine1 = Math.sin(i * frequency + time + phaseShift);
                const sine2 = Math.cos(i * 0.015 - time * 1.3);
                const envelope = Math.sin((i / 250) * Math.PI);

                let waveY = yOffset + sine1 * sine2 * amplitude * envelope * energy;

                if (currentMode === 'thinking') {
                    waveY += Math.sin(i * 0.1 + time * 6) * 10 * envelope;
                }

                if (i === 0) {
                    ctx.moveTo(x, waveY);
                } else {
                    ctx.lineTo(x, waveY);
                }
                x += sliceWidth;
            }
            ctx.stroke();
        }

        function drawParticles() {
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;

                if (p.x < 0) p.x = width;
                if (p.x > width) p.x = 0;
                if (p.y < 0) p.y = height;
                if (p.y > height) p.y = 0;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(129, 140, 248, ${p.alpha})`;
                ctx.fill();
            });
        }

        function drawClassicLightBar() {
            time += 0.05;

            ctx.fillStyle = '#030712';
            ctx.fillRect(0, 0, width, height);

            const centerY = height / 2;
            const barWidth = Math.min(width * 0.94, 1100);
            const startX = (width - barWidth) / 2;
            const endX = startX + barWidth;
            const barHeight = 22;

            ctx.save();
            ctx.shadowColor = 'rgba(0, 210, 255, 0.4)';
            ctx.shadowBlur = 35;

            ctx.beginPath();
            ctx.roundRect(startX - 10, centerY - 24, barWidth + 20, 48, 16);
            ctx.fillStyle = 'rgba(15, 23, 42, 0.95)';
            ctx.fill();
            ctx.restore();

            const gradient = ctx.createLinearGradient(startX, centerY, endX, centerY);
            
            if (currentMode === 'thinking') {
                const shift = (Math.sin(time * 4) + 1) / 2;
                gradient.addColorStop(0.0, 'rgba(0, 180, 216, 0.5)');
                gradient.addColorStop(0.5 + (shift - 0.5) * 0.4, 'rgba(255, 255, 255, 0.95)');
                gradient.addColorStop(1.0, 'rgba(0, 119, 182, 0.5)');
            } else if (currentMode === 'speaking') {
                const pulse = Math.abs(Math.sin(time * 7)) * 0.4 + 0.6;
                gradient.addColorStop(0.0, 'rgba(0, 150, 255, 0.5)');
                gradient.addColorStop(0.5, `rgba(200, 240, 255, ${pulse})`);
                gradient.addColorStop(1.0, 'rgba(0, 150, 255, 0.5)');
            } else {
                gradient.addColorStop(0.0, 'rgba(0, 80, 120, 0.15)');
                gradient.addColorStop(0.5, 'rgba(0, 180, 216, 0.35)');
                gradient.addColorStop(1.0, 'rgba(0, 80, 120, 0.15)');
            }

            ctx.save();
            ctx.shadowColor = currentMode === 'idle' ? 'rgba(0, 150, 200, 0.25)' : 'rgba(0, 220, 255, 0.9)';
            ctx.shadowBlur = currentMode === 'idle' ? 12 : 32;

            ctx.beginPath();
            ctx.roundRect(startX, centerY - barHeight / 2, barWidth, barHeight, 10);
            ctx.fillStyle = gradient;
            ctx.fill();
            ctx.restore();
        }

        function animate() {
            if (currentModel === 'plus') {
                energy += (targetEnergy - energy) * 0.08;
                time += currentMode === 'thinking' ? 0.08 : 0.04;

                ctx.fillStyle = '#030712';
                ctx.fillRect(0, 0, width, height);

                drawParticles();

                const centerY = height / 2;

                // Alexa+ Indigo / Purple / Cyan Gradient Wave Suite
                drawWave(centerY, 0.012, 45, 'rgba(79, 70, 229, 0.25)', 10, 0);       // Indigo Outer
                drawWave(centerY, 0.016, 38, 'rgba(99, 102, 241, 0.5)', 6, 0.5);      // Violet Wave
                drawWave(centerY, 0.020, 28, 'rgba(168, 85, 247, 0.8)', 3.5, 1.0);    // Purple Core
                drawWave(centerY, 0.010, 15, 'rgba(255, 255, 255, 0.95)', 1.5, 1.8);  // White Sparkle Center
            } else {
                drawClassicLightBar();
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
